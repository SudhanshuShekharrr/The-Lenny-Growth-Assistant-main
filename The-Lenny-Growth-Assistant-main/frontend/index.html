<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Lenny Growth Assistant</title>
<style>
  :root {
    --bg: #FAF9F6; --surface: #FFFFFF; --surface-2: #F4F1EA;
    --border: #E8E3D8; --text: #1F1B16; --text-muted: #6B6459;
    --accent: #C15F3C; --accent-soft: #F3E4DC;
    --ungrounded: #A9762F; --ungrounded-bg: #FBF3E7;
    --error: #B3261E; --error-bg: #FCEEEC;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; }

  .sidebar {
    width: 240px; background: var(--surface-2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px;
  }
  .sidebar h1 {
    font-size: 15px; margin: 4px 8px 20px; font-weight: 600; letter-spacing: -0.01em;
  }
  .new-chat-btn {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 11px; cursor: pointer; font-size: 14px; font-weight: 500; margin-bottom: 16px;
    transition: opacity 0.15s;
  }
  .new-chat-btn:hover { opacity: 0.9; }
  .session-item {
    padding: 8px 10px; border-radius: 6px; font-size: 12px; color: var(--text-muted);
    font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .main { flex: 1; display: flex; min-width: 0; }
  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .messages { flex: 1; overflow-y: auto; padding: 32px 24px; }
  .msg { max-width: 720px; margin: 0 auto 28px; display: flex; gap: 12px; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; margin-top: 2px;
  }
  .msg.user .avatar { background: var(--surface-2); color: var(--text-muted); }
  .msg.assistant .avatar { background: var(--accent); color: white; }

  .msg-body { min-width: 0; flex: 1; }
  .msg.user .msg-body { display: flex; justify-content: flex-end; }

  .msg.user .bubble {
    background: var(--surface-2); color: var(--text); padding: 10px 16px; border-radius: 14px;
    display: inline-block; max-width: 85%; font-size: 14.5px; line-height: 1.55;
  }
  .msg.assistant .bubble {
    padding: 2px 0; line-height: 1.65; font-size: 14.5px; white-space: pre-wrap;
  }
  .msg.assistant.ungrounded .bubble {
    background: var(--ungrounded-bg); border: 1px solid #E8D4B0; border-radius: 10px;
    padding: 12px 14px;
  }
  .msg.assistant.error .bubble {
    background: var(--error-bg); border: 1px solid #F0C9C4; color: var(--error);
    border-radius: 10px; padding: 12px 14px;
  }
  .msg.assistant .bubble.loading { color: var(--text-muted); font-style: italic; }

  .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .source-chip {
    font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-muted); padding: 4px 10px; border-radius: 999px; font-weight: 500;
  }
  .ungrounded-flag {
    font-size: 12px; color: var(--ungrounded); margin-top: 8px; display: flex;
    align-items: center; gap: 5px; font-weight: 500;
  }
  .retry-btn {
    margin-top: 10px; background: var(--surface); border: 1px solid var(--error);
    color: var(--error); padding: 5px 14px; border-radius: 8px; cursor: pointer;
    font-size: 12.5px; font-weight: 500;
  }
  .retry-btn:hover { background: var(--error-bg); }

  .input-bar {
    border-top: 1px solid var(--border); padding: 18px 24px; display: flex;
    gap: 8px; max-width: 768px; margin: 0 auto; width: 100%; background: var(--bg);
  }
  .input-bar input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 13px 16px; border-radius: 12px; font-size: 14.5px; outline: none;
    transition: border-color 0.15s;
  }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input:disabled { opacity: 0.55; cursor: not-allowed; }
  .input-bar input::placeholder { color: var(--text-muted); }
  .input-bar button {
    padding: 13px 18px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 13.5px; font-weight: 500; transition: opacity 0.15s;
  }
  .btn-send { background: var(--accent); color: white; }
  .btn-artifact { background: var(--surface-2); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-send:disabled, .btn-artifact:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-send:not(:disabled):hover, .btn-artifact:not(:disabled):hover { opacity: 0.85; }

  .artifact-panel {
    width: 46%; border-left: 1px solid var(--border); display: none;
    flex-direction: column; background: var(--surface);
    animation: slideIn 0.25s ease-out;
  }
  @keyframes slideIn {
    from { transform: translateX(24px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .artifact-panel.open { display: flex; }
  .artifact-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 500; color: var(--text-muted);
  }
  .artifact-header button {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12.5px;
  }
  .artifact-header button:hover { background: var(--surface-2); }
  .artifact-frame { flex: 1; border: none; background: white; }

  .loading { color: var(--text-muted); font-size: 14px; font-style: italic; }
  .empty-state {
    color: var(--text-muted); text-align: center; margin-top: 100px; font-size: 14.5px;
    max-width: 400px; margin-left: auto; margin-right: auto; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <h1>Lenny Growth Assistant</h1>
    <button class="new-chat-btn" onclick="startNewSession()">+ New chat</button>
    <div id="sessionInfo" class="session-item">No active session</div>
        <div style="margin-top: 16px;">
      <label style="font-size: 11.5px; color: var(--text-muted); display: block; margin-bottom: 6px;" for="providerSelect">Model</label>
      <select id="providerSelect" style="width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px;">
        <option value="ollama">Ollama (local)</option>
        <option value="anthropic">Claude (cloud)</option>
      </select>
      <div id="providerActual" style="font-size: 11px; color: var(--text-muted); margin-top: 6px;"></div>
    </div>
  </div>

  <div class="main">
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="empty-state">Ask a product/growth question grounded in Lenny's Podcast transcripts.</div>
      </div>
      <div class="input-bar">
        <input id="messageInput" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
        <button class="btn-artifact" id="artifactBtn" onclick="generateArtifact()">Generate Artifact</button>
      </div>
    </div>

    <div class="artifact-panel" id="artifactPanel">
    <div class="artifact-header">
        <span>
          <span id="artifactTypeBadge" style="background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-right: 8px;">MD</span>
          <span id="artifactTitle">Artifact</span>
        </span>
        <span style="display: flex; gap: 6px;">
          <button onclick="copyArtifact()">Copy</button>
          <button onclick="downloadArtifact()">Download</button>
          <button onclick="closeArtifact()">Close</button>
        </span>
      </div>
      <iframe class="artifact-frame" id="artifactFrame" sandbox="allow-scripts"></iframe>
    </div>
  </div>

</div>

<script>
const API_BASE = "http://localhost:8000";
let sessionId = null;

function startNewSession() {
  sessionId = null;
  document.getElementById("sessionInfo").textContent = "New session (not yet created)";
  document.getElementById("messages").innerHTML =
    '<div class="empty-state">Ask a product/growth question grounded in Lenny\'s Podcast transcripts.</div>';
  closeArtifact();
}

function appendMessage(role, text, opts = {}) {
  const container = document.getElementById("messages");
  const empty = container.querySelector(".empty-state");
  if (empty) empty.remove();

  const wrap = document.createElement("div");
  wrap.className = `msg ${role}` + (opts.ungrounded ? " ungrounded" : "") + (opts.error ? " error" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Y" : "L";
  wrap.appendChild(avatar);

  const msgBody = document.createElement("div");
  msgBody.className = "msg-body";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msgBody.appendChild(bubble);

  if (opts.retryable) {
    const retryBtn = document.createElement("button");
    retryBtn.className = "retry-btn";
    retryBtn.textContent = "Retry";
    retryBtn.onclick = retryLastMessage;
    msgBody.appendChild(retryBtn);
  }

  if (opts.ungrounded && role === "assistant") {
    const flag = document.createElement("div");
    flag.className = "ungrounded-flag";
    flag.textContent = "⚠ No matching source material found in the transcripts";
    msgBody.appendChild(flag);
  }

  if (opts.sources && opts.sources.length > 0) {
    const srcWrap = document.createElement("div");
    srcWrap.className = "sources";
    opts.sources.forEach(s => {
      const chip = document.createElement("span");
      chip.className = "source-chip";
      chip.textContent = s.title || s.source_path;
      srcWrap.appendChild(chip);
    });
    msgBody.appendChild(srcWrap);
  }

  wrap.appendChild(msgBody);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return wrap;
}

let lastFailedMessage = null;

function startLoadingAnimation(bubbleEl) {
  const states = ["Thinking", "Thinking.", "Thinking..", "Thinking..."];
  let i = 0;
  bubbleEl.textContent = states[0];
  return setInterval(() => {
    i = (i + 1) % states.length;
    bubbleEl.textContent = states[i];
  }, 400);
}

async function sendMessage(retryText) {
  const input = document.getElementById("messageInput");
  const text = retryText || input.value.trim();
  if (!text) return;

  if (!retryText) input.value = "";
  input.disabled = true;
  document.getElementById("sendBtn").disabled = true;

  if (!retryText) appendMessage("user", text);
  const loadingMsg = appendMessage("assistant", "Thinking", {});
  const bubbleEl = loadingMsg.querySelector(".bubble");
  bubbleEl.classList.add("loading");
  const intervalId = startLoadingAnimation(bubbleEl);

  try {
    const resp = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text, provider: document.getElementById("providerSelect").value }),
    });

    clearInterval(intervalId);
    loadingMsg.remove();

    if (!resp.ok) {
      const errBody = await resp.json().catch(() => ({}));
      lastFailedMessage = text;
      appendMessage("assistant", errBody?.error?.message || `Error ${resp.status}`, { error: true, retryable: true });
      return;
    }

    const data = await resp.json();
    sessionId = data.session_id;
    document.getElementById("providerActual").textContent = `Answered by: ${data.llm_provider} (${data.llm_model})`;
    document.getElementById("sessionInfo").textContent = `Session: ${sessionId.slice(0, 8)}...`;

    const uniqueSources = [];
    const seenTitles = new Set();
    for (const s of data.sources) {
      const key = s.title || s.source_path;
      if (!seenTitles.has(key)) {
        seenTitles.add(key);
        uniqueSources.push(s);
      }
    }

    appendMessage("assistant", data.message, {
      ungrounded: !data.grounded,
      sources: uniqueSources,
    });
  } catch (err) {
    clearInterval(intervalId);
    loadingMsg.remove();
    lastFailedMessage = text;
    appendMessage("assistant", `Connection error: ${err.message}. Is the backend running?`, { error: true, retryable: true });
  } finally {
    input.disabled = false;
    document.getElementById("sendBtn").disabled = false;
    input.focus();
  }
}

function retryLastMessage() {
  if (lastFailedMessage) sendMessage(lastFailedMessage);
}

// --- Minimal, dependency-free markdown -> HTML for the artifact viewer ---
function renderMarkdown(md) {
  let html = md
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Fenced code blocks first, before other inline processing touches them
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);

  // Setext-style headings (text followed by a line of === or ---)
  html = html.replace(/^(.+)\n=+\s*$/gm, "<h1>$1</h1>");
  html = html.replace(/^(.+)\n-{3,}\s*$/gm, "<h2>$1</h2>");

  html = html
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/^\d+\.\s+(.*)$/gm, "<li>$1</li>")
    .replace(/^[-*]\s+(.*)$/gm, "<li>$1</li>");

  // Wrap consecutive <li> lines in a single <ul>
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (match) => `<ul>${match}</ul>`);

  html = html.replace(/\n\n/g, "</p><p>");
  return `<p>${html}</p>`;
}

async function generateArtifact() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text) { alert("Type an instruction first, e.g. 'Write a markdown summary of onboarding advice'"); return; }

  input.value = "";
  const btn = document.getElementById("artifactBtn");
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Generating...";

  try {
    const resp = await fetch(`${API_BASE}/api/artifacts`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, instruction: text }),
    });

    if (!resp.ok) {
      const errBody = await resp.json().catch(() => ({}));
      alert(errBody?.error?.message || `Error ${resp.status}`);
      return;
    }

    const data = await resp.json();
    openArtifact(data);
  } catch (err) {
    alert(`Connection error: ${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

let currentArtifact = null;

function openArtifact(data) {
  currentArtifact = data;
  document.getElementById("artifactPanel").classList.add("open");
  document.getElementById("artifactTitle").textContent = data.title || "Artifact";
  document.getElementById("artifactTypeBadge").textContent = data.artifact_type === "html" ? "HTML" : "MD";

  const frame = document.getElementById("artifactFrame");
  let docHtml;

  if (data.artifact_type === "html") {
    docHtml = data.content;
  } else {
    docHtml = `<!DOCTYPE html><html><head><meta charset="utf-8">
      <style>body{font-family:-apple-system,sans-serif;padding:24px;line-height:1.6;color:#1a1a1a;}
      h1,h2,h3{margin-top:1.2em;} code{background:#f0f0f0;padding:2px 4px;border-radius:4px;}
      pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow-x:auto;}</style>
      </head><body>${renderMarkdown(data.content)}</body></html>`;
  }

  frame.srcdoc = docHtml;
}

function copyArtifact() {
  if (!currentArtifact) return;
  navigator.clipboard.writeText(currentArtifact.content).then(() => {
    alert("Copied to clipboard");
  }).catch(() => {
    alert("Copy failed — your browser may block clipboard access on this page.");
  });
}

function downloadArtifact() {
  if (!currentArtifact) return;
  const ext = currentArtifact.artifact_type === "html" ? "html" : "md";
  const blob = new Blob([currentArtifact.content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${(currentArtifact.title || "artifact").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
}

function closeArtifact() {
  document.getElementById("artifactPanel").classList.remove("open");
  document.getElementById("artifactFrame").srcdoc = "";
  currentArtifact = null;
}
</script>
</body>
</html>
